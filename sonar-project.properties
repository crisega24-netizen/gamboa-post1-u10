# =====================================================================
# Configuracion del analisis de SonarQube para envios-service
# ---------------------------------------------------------------------
# Nota: SonarScanner for Maven (mvn sonar:sonar) no lee este archivo;
# toma las propiedades del bloque <properties> del pom.xml, que replica
# estos mismos valores. Este archivo documenta la configuracion y sirve
# si el analisis se ejecuta con el SonarScanner CLI (sonar-scanner).
# =====================================================================

# --- Identificacion del proyecto -------------------------------------
# Clave unica del proyecto en SonarQube (groupId:artifactId)
sonar.projectKey=com.universidad:envios-service
# Nombre visible en el dashboard
sonar.projectName=Envios Service
# Version fija: el codigo nuevo se mide desde el primer analisis de 1.0
sonar.projectVersion=1.0

# --- Codigo a analizar -----------------------------------------------
# Codigo de produccion: se analiza y se mide su cobertura
sonar.sources=src/main/java
# Codigo de prueba: se analiza con reglas de pruebas y no cuenta en la cobertura
sonar.tests=src/test/java
# Bytecode compilado que necesitan las reglas de Java (ejecutar mvn verify antes)
sonar.java.binaries=target/classes

# --- Cobertura -------------------------------------------------------
# Reporte XML que genera JaCoCo en la fase verify (goal report)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# --- Exclusiones (Decision de diseno 2) ------------------------------
# No se excluye ninguna clase: el proyecto no tiene clase de arranque,
# DTOs ni configuracion; todo el codigo de src/main/java es logica de
# negocio y excluir algo ocultaria justamente lo que se quiere medir.
# sonar.exclusions=

# --- Servidor --------------------------------------------------------
# SonarQube local en Docker (Decision de diseno 1)
sonar.host.url=http://localhost:9000
# No esperar el resultado del Quality Gate para terminar el comando
sonar.qualitygate.wait=false

# El token NO va en este archivo: se pasa por linea de comandos
# (mvn sonar:sonar -Dsonar.token=...) para no subirlo a GitHub.
